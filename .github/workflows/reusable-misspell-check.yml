name: Reusable - Misspell check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  misspell-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install misspell
        run: |
          curl -L -o install-misspell.sh \
               https://raw.githubusercontent.com/client9/misspell/master/install-misspell.sh
          sh ./install-misspell.sh

      - name: Run misspell
        run: |
          # Temporarily ignoring some British English spellings that are currently in the codebase
          # TODO: Gradually replace these with American English equivalents and remove from ignore list
          find . -type f \
                 -not -path './licenses/*' \
               | xargs bin/misspell -locale US -i "cancelled,CANCELLED,colours,customise,analogues,serialisation,synchronised,unauthorised" -error
